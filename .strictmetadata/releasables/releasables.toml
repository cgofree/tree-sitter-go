format_version = 1
repository_layout = "standalone"
release_branches = ["main"]

[[releasables]]
name = "tree-sitter-go"
tag_format = "v{version}"
publish_mode = "ci"

[[members]]
path = "."
name = "root"
releasable = "tree-sitter-go"
targets = [{ name = "go" }]

[[members.pipelines]]
name = "go"
type = "go"
target = "go"
local = false
artifact = "library"
